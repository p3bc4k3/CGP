<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jean Delonca — Contact</title>
  <meta name="description" content="Coordonnées de Jean Delonca, Conseiller en Gestion de Patrimoine indépendant.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .contact-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 36px 28px;
      text-align: center;
    }
    .contact-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 22px;
    }
    .contact-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }
    .contact-name {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .contact-title {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--gold);
    }
    .contact-org {
      margin-top: 2px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .contact-list {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }
    .contact-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      word-break: break-word;
    }
    .contact-list a:hover {
      border-color: var(--gold);
      color: var(--text-primary);
    }
    .contact-list svg {
      color: var(--gold);
      flex-shrink: 0;
    }
    .contact-save-btn {
      width: 100%;
      margin-top: 22px;
    }
    .qr-placeholder {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qr-frame {
      width: 132px;
      height: 132px;
      border-radius: var(--radius-sm);
      position: relative;
      background: rgba(255,255,255,0.02);
    }
    .qr-frame span {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
    }
    .qr-frame span:nth-child(1) { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .qr-frame span:nth-child(2) { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .qr-frame span:nth-child(3) { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .qr-frame span:nth-child(4) { bottom: 8px; right: 8px; border-left: none; border-top: none; }
    .qr-note {
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .qr-note strong {
      display: block;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

<main class="contact-wrap">
  <div class="contact-card reveal">
    <div class="contact-badge">◆ Agent Commercial · Membre Hubnup · RSAC Béziers N° 831 889 670</div>

    <p class="contact-title">Conseiller en Gestion de Patrimoine indépendant</p>
    <p class="contact-org">Delonca Consulting</p>

    <ul class="contact-list">

          06 45 88 01 84
        </a>
      </li>
      <li>
        <a href="mailto:jean.delonca@gmail.com">

          jean.delonca@gmail.com
        </a>
      </li>
      <li>
        <a href="https://patrimoine.delonca.com">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          patrimoine.delonca.com
        </a>
      </li>
    </ul>

    <a href="contact.vcf" download="Jean-Delonca.vcf" class="btn btn-primary contact-save-btn">Enregistrer le contact</a>

    <div class="qr-placeholder">
      <div class="qr-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="qr-note"><strong>QR code</strong>patrimoine.delonca.com/contact.html</p>
    </div>
  </div>
</main>

<script src="app.js" defer></script>
</body>
</html>
